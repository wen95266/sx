name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击一键打包

# 赋予自动发布 Release 和覆盖旧 APK 文件的写权限
permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装项目依赖
        run: npm install

      - name: 构建前端静态资源
        run: npm run build

      - name: 同步 Capacitor 原生工程
        run: npx cap sync android

      - name: 配置 Java 21 环境 (适配 Gradle 8.14)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 配置 Android SDK 环境
        uses: android-actions/setup-android@v3

      - name: 赋予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 编译 Android APK (Debug免签直装版)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cd ..

      - name: 归档并重命名 APK 文件
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/shisanshui-latest.apk

      # 1. 产物上传：Actions 每次运行自动覆盖同名构件
      - name: 上传构建产物至 Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shisanshui-apk
          path: output/shisanshui-latest.apk
          overwrite: true

      # 2. 自动覆盖发布：推送到固定 tag "latest"，每次提交自动覆盖旧文件并生成固定下载链接
      - name: 发布并覆盖 GitHub Release 最新安装包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "十三水最新安装包 (Latest Build)"
          body: |
            ### 🎲 十三水多人对战最新 Android 安装包
            - **自动构建机制**：修改仓库代码后自动重新打包，已自动覆盖旧版文件
            - **提交哈希**：`${{ github.sha }}`
            - **手机安装说明**：本 APK 为免签直装版，手机下载后直接点击即可安装运行。
          files: output/shisanshui-latest.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
