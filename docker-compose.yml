services:
  shisanshui:
    build: .
    container_name: shisanshui-game
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - TG_BOT_TOKEN=${TG_BOT_TOKEN:-}
      - TG_ADMIN_ID=${TG_ADMIN_ID:-}
    volumes:
      - ./authorized_phones.json:/app/authorized_phones.json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
