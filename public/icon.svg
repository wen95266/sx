<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background with gold border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#gold)" stroke-width="8" stroke-opacity="0.7" />

  <!-- Inner Crest -->
  <g filter="url(#shadow)">
    <!-- Card Back 1 -->
    <rect x="140" y="90" width="160" height="230" rx="16" fill="#1E293B" stroke="url(#gold)" stroke-width="4" transform="rotate(-12 220 205)" />
    <!-- Card Back 2 (Main) -->
    <rect x="210" y="80" width="160" height="230" rx="16" fill="#0F172A" stroke="url(#gold)" stroke-width="4" transform="rotate(8 290 195)" />
    
    <!-- Big 13 Water Symbol -->
    <text x="256" y="240" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="96" fill="url(#gold)" text-anchor="middle" letter-spacing="2">13</text>
    
    <!-- Four Card Suits below 13 -->
    <text x="180" y="300" font-size="36" fill="#F87171" text-anchor="middle">♥</text>
    <text x="230" y="300" font-size="36" fill="#94A3B8" text-anchor="middle">♠</text>
    <text x="282" y="300" font-size="36" fill="#F87171" text-anchor="middle">♦</text>
    <text x="332" y="300" font-size="36" fill="#94A3B8" text-anchor="middle">♣</text>
  </g>

  <!-- App Title Banner -->
  <text x="256" y="400" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">十三水</text>
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="url(#gold)" text-anchor="middle" letter-spacing="4">多人竞技对战</text>
</svg>
